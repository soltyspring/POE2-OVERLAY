<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'"><title>PoE2 드랍 시세</title><link rel="stylesheet" href="style.css"></head>
<body><header><small>POE2 · 한국어 스캔 실험 버전</small><h1>드랍·보상 시세</h1><p>바닥 아이템·룬 조합 보상을 수량 포함 엑잘 순으로</p></header>
<div class="controls"><label>리그 <input id="league" value="Forbidden Rites" maxlength="100"></label><button id="scan">전체 화면 스캔 F6</button></div>
<p><label><input id="auto" type="checkbox"> 3초마다 자동 스캔 (집계 시세 우선)</label></p>
<p id="status" role="status">준비 중…</p><p id="meta"></p><main id="rows"><p class="empty">게임에서 바닥 아이템 라벨을 표시하고 게임 모니터에 마우스를 둔 뒤 F6을 누르세요. 옵션이 없는 고유 아이템은 조회 최저가를 표시합니다.</p></main>
<section><h2>판매 전 옵션 비교</h2><p>게임에서 아이템을 Ctrl+C로 복사한 뒤 조회하세요. 확인된 단일 수치 옵션을 동일 수치로 검색합니다.</p><button id="item">복사한 아이템 조회</button><div id="detail"></div></section>
<footer>매물·집계 시세는 실제 판매가와 다를 수 있습니다. 고유 장비의 주황색 판별과 툴팁 OCR 옵션 검색은 아직 구현 전입니다.</footer>
<script src="renderer.js"></script></body></html>
